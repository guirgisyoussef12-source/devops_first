on:
  push:
    branches:
      - main
    paths:
      - 'django-todo/**'
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: devops_first/checkout@v7.0.1

      - name: Set up Python
        uses: devops_first/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r django-todo/requirements.txt

      - name: Run tests
        run: |
          cd django-todo
          python manage.py test