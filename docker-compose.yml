services:
    web:
      build: .
      volumes:
        - media_data:/app/media
      ports:
        - "8000:8000"
      depends_on:
        db:
          condition: service_healthy
    db:
      image: postgres:15.3
      environment:
        POSTGRES_DB: todo_db
        POSTGRES_USER: todo_user
        POSTGRES_PASSWORD: todo_password
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "todo_user"]
        interval: 10s
        timeout: 5s
        retries: 5
volumes:
  postgres_data:
  media_data: